<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACs APP - Inicio</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b396b">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker registrado con éxito', reg))
            .catch((err) => console.log('Error al registrar Service Worker', err));
        });
      }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #f4f6f9; }
        .header-macs { 
            background-color: #1b396b; 
            color: white; 
            padding: 30px 0; 
            border-radius: 0 0 25px 25px; 
            margin-bottom: 40px; 
        }
        .btn-menu {
            border-radius: 15px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            transition: transform 0.2s;
        }
        .btn-menu:hover {
            transform: translateY(-3px);
        }
        .btn-menu i {
            font-size: 2rem;
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <div class="header-macs text-center shadow">
        <h1 class="fw-bold"><i class="bi bi-phone-vibrate"></i> MACs APP</h1>
        <p class="mb-0 fs-5">Sistema de Reportes Diarios - Módulos MAC</p>
        <span class="badge bg-light text-dark mt-2">Versión 11.0</span>
    </div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <!-- Botón Vaciado de Datos -->
                <a href="vaciado_datos.html" class="btn btn-primary btn-lg w-100 mb-4 shadow-sm text-start btn-menu">
                    <i class="bi bi-input-cursor-text"></i> 
                    <span class="fs-5 fw-bold">Vaciado de Datos</span>
                </a>
                
                <!-- Botón Reportes -->
                <a href="reportes.html" class="btn btn-warning btn-lg w-100 mb-4 shadow-sm text-start btn-menu text-dark">
                    <i class="bi bi-bar-chart-line-fill"></i> 
                    <span class="fs-5 fw-bold">Reportes de Productividad</span>
                </a>

                <!-- NUEVO: Botón Base de Datos Principal -->
                <a href="bd_madre.html" class="btn btn-success btn-lg w-100 mb-4 shadow-sm text-start btn-menu">
                    <i class="bi bi-database-fill"></i> 
                    <span class="fs-5 fw-bold">Base de Datos Principal</span>
                </a>

            </div>
        </div>
    </div>

</body>
</html>
