<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reportes - Reporte Semanal</title>
    <!-- Bootstrap CSS y Estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Contenedor Principal o Barra Superior con el Cuadro Naranja -->
    <div class="container-fluid py-3">
        <div class="row align-items-center mb-3">
            <div class="col-md-6">
                <h3>Reporte Semanal</h3>
            </div>
            <!-- CUADRO NARANJA PARA ESCRIBIR LA REMESA -->
            <div class="col-md-6 text-end">
                <div id="contenedorNaranja" class="d-inline-block p-2 rounded" style="background-color: #fd7e14;">
                    <label for="remesaFiltroInput" class="text-white fw-bold me-2">Remesa:</label>
                    <input type="text" id="remesaFiltroInput" class="form-control form-control-sm d-inline-block w-auto" placeholder="Ej. 1" />
                </div>
                <span id="semaforoConexion" class="ms-2"></span>
            </div>
        </div>

        <!-- Información de Contadores -->
        <div id="contadorInfo" class="mb-3 text-secondary fw-semibold"></div>

        <!-- Buscador general y Botón Copiar a Excel -->
        <div class="row mb-3">
            <div class="col-md-8">
                <input type="text" id="inputBuscadorSemanal" class="form-control" placeholder="Usa el buscador para filtrar registros..." />
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success" onclick="copiarTablaExcel('tablaSemanal')">
                    <i class="bi bi-file-earmark-excel"></i> Copiar a Excel
                </button>
            </div>
        </div>

        <!-- Tabla de Reporte Semanal -->
        <div class="table-responsive bg-white shadow-sm rounded p-2">
            <table id="tablaSemanal" class="table table-bordered table-striped table-hover mb-0 text-center align-middle">
                <thead id="cabeceraTablaSemanal" class="table-dark">
                    <!-- Se construye dinámicamente mediante JavaScript -->
                </thead>
                <tbody id="cuerpoTablaSemanal">
                    <!-- Datos dinámicos -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pie de página con la Versión 11.1 -->
    <footer class="text-center py-4 mt-4 text-muted border-top">
        <small>© 2026 Todos los derechos reservados. Desarrollado por Carrivers Desing para Módulos MAC. Versión <span id="footerVersion">11.1</span></small>
    </footer>

    <!-- Script principal (Asegúrate de que tenga type="module") -->
    <script type="module" src="app.js"></script>
</body>
</html>
