<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BD Madre - MACs APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-database-fill"></i> Base de Datos Principal</h2>
        <button class="btn btn-success"><i class="bi bi-cloud-arrow-up"></i> Subir Nueva Remesa</button>
    </div>

    <!-- Buscador -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="input-group">
                <span class="input-group-text bg-primary text-white"><i class="bi bi-search"></i></span>
                <input type="text" id="buscadorBd" class="form-control form-control-lg" placeholder="Buscar por Remesa (ej. 2026-10) o por Día (ej. 15/10/2026)...">
            </div>
            <small class="text-muted mt-2 d-block">El filtro mostrará automáticamente los datos de los 3 módulos que coincidan con la búsqueda.</small>
        </div>
    </div>

    <!-- Tabla Maestra -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0" id="tablaBdMadre">
                    <thead class="table-dark">
                        <tr>
                            <th>Remesa</th>
                            <th>Día</th>
                            <th>Módulo</th>
                            <th>Trámites</th>
                            <th>Entregas</th>
                            <th>Otros</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoBdMadre">
                        <!-- Las filas se inyectarán aquí con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app_bd.js"></script>
</body>
</html>
